[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chrome"
version = "0.1.0"
description = "CHROME: Contact-conditioned Human-Ruled Object Metric Estimation (NVIDIA V2D Track 1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chrome*"]
